# default.conf
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------
    gzip on;
    gzip_http_version 1.1;
    gzip_disable "MSIE6";
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/json
      application/javascript
      application/xml
      application/xml+rss
      application/ld+json
      image/svg+xml;
    gzip_comp_level 6;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------
    # Security headers (applied globally)
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------
    # Hashed assets (JS, CSS, fonts) - immutable cache
    # ---------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      access_log off;
    }

    # ---------------------------------------------------------------
    # Images - long cache
    # ---------------------------------------------------------------
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      add_header X-Content-Type-Options "nosniff" always;
      access_log off;
    }

    # ---------------------------------------------------------------
    # SEO files - short cache so updates are picked up quickly
    # ---------------------------------------------------------------
    location = /robots.txt {
      add_header Cache-Control "public, max-age=86400";
      access_log off;
    }

    location = /sitemap.xml {
      add_header Cache-Control "public, max-age=86400";
      add_header Content-Type "application/xml; charset=utf-8";
      access_log off;
    }

    location = /llms.txt {
      add_header Cache-Control "public, max-age=86400";
      access_log off;
    }

    # ---------------------------------------------------------------
    # SPA fallback - no cache on HTML so deployments take effect
    # ---------------------------------------------------------------
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
  }
}
